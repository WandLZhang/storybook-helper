      @font-face { font-family: 'Hanzi-Pinyin'; src: url('/fonts/Hanzi-Pinyin-Font.top.woff2') format('woff2'); font-display: swap; font-weight: 400; }
      html, body, #root { height: 100%; margin: 0; background: #0a0a0b; }
    </style>
